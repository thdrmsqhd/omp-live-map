name: V3 Windows verification

on:
  push:
    branches: ['v2/phase-0-baseline', 'v2/phase-1-3', 'v3/phase-4-6', 'v4/ui-ux-improvements', 'v5/claude-harness', 'v6/chat-ux', 'v7/performance', 'v8/incremental-performance', 'feature/harness-editor', 'feature/workflow-canvas', 'main']
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/v2-windows-isolation.yml'
      - 'desktop/windows/**'
      - 'server/engineering/windows-checks.js'
      - 'tests/verification/windows-checks.cjs'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Existing regression tests
        run: node --test
      - name: Windows Git Bash terminal API
        run: node tests/verification/windows-shell.cjs
      - name: Windows AppContainer proof
        if: ${{ !cancelled() }}
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools are unavailable' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'omp-appcontainer.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'omp-appcontainer.obj'
          $compile = 'call "' + $vcvars + '" && cl /nologo /W4 /EHsc /std:c++17 /MT /Fo:"' + $obj + '" /Fe:"' + $exe + '" tests/verification/appcontainer.cpp /link userenv.lib advapi32.lib ws2_32.lib'
          cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/verification/appcontainer.cjs $exe
      - name: SQLite recovery probe
        if: ${{ !cancelled() }}
        run: node tests/verification/sqlite.cjs
      - name: Prepare Electron and Chromium
        if: ${{ !cancelled() }}
        id: prepare
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 electron@43.8.12 monaco-editor@0.52.2
          npx playwright install --only-shell chromium
      - name: Electron desktop lifecycle proof
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node tests/verification/electron.cjs
      - name: Browser regression and 10-session measurement
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node tests/verification/browser.cjs
      - name: Upload V4 UX screenshots
        if: ${{ !cancelled() && github.ref_name == 'v4/ui-ux-improvements' }}
        uses: actions/upload-artifact@v4
        with:
          name: V4-UX-screenshots
          path: artifacts/v4-ux/*.png
          if-no-files-found: error
      - name: Product desktop UI and protected API
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: node tests/verification/engineering-desktop.cjs
  graph-performance:
    if: github.ref_name == 'v8/incremental-performance'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Compare identical fixtures across V5, V7 and V8
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx playwright install --only-shell chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $current = $PWD.Path
          $out = Join-Path $current 'artifacts/graph-performance'
          New-Item -ItemType Directory -Force $out | Out-Null
          $versions = [ordered]@{
            v5 = 'a92e836186b5be402112b3f7f7b513d21a4792a7'
            v7 = 'cd8282d4a3344faa2d248bce9ab87092b9c7579a'
            v8 = $env:GITHUB_SHA
          }
          foreach ($version in $versions.Keys) {
            $repo = $current
            if ($version -ne 'v8') {
              $repo = Join-Path $env:RUNNER_TEMP "omp-graph-$version"
              git worktree add --detach $repo $versions[$version]
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            $env:OMP_BENCH_REPO = $repo
            $env:OMP_BENCH_REF = $versions[$version]
            $env:OMP_BENCH_OUTPUT = Join-Path $out "$version.json"
            node --test tests/verification/graph-performance.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $env:OMP_MEMORY_OUTPUT = Join-Path $out "$version-backend-memory.json"
            node tests/verification/backend-memory.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: omp-v8-comparable-performance
          path: artifacts/graph-performance/*.json
          if-no-files-found: ignore
  installer:
    needs: windows
    if: github.ref_name == 'v3/phase-4-6' || github.ref_name == 'main'
    permissions:
      contents: write
    concurrency:
      group: omp-windows-installer-${{ github.ref }}
      cancel-in-progress: false
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build Windows installer
        run: |
          npm --prefix desktop install --package-lock=false
          npm --prefix desktop run build:windows -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OMP-Live-Map-V3-Windows-development
          path: desktop/dist/OMP-Live-Map-V3-Setup.exe
          if-no-files-found: error
      - name: Install on hosted Windows and verify local assets
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'omp-v3-install'
          $setup = Join-Path $PWD 'desktop/dist/OMP-Live-Map-V3-Setup.exe'
          $result = Start-Process -FilePath $setup -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed: $($result.ExitCode)" }
          $env:OMP_MAP_INSTALLED_EXE = Join-Path $target 'OMP Live Map V3.exe'
          if (!(Test-Path -LiteralPath $env:OMP_MAP_INSTALLED_EXE)) { throw 'Installed executable not found' }
          npm install --no-save --package-lock=false playwright@1.56.1 electron@43.8.12
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/verification/engineering-desktop.cjs
      - name: Verify uninstall retains workspace data
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'omp-v3-install'
          $data = Join-Path $env:APPDATA 'OMP Live Map V3'
          $marker = Join-Path $data 'retention-test.txt'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          Set-Content -Path $marker -Value 'preserve'
          $uninstall = Get-ChildItem -LiteralPath $target -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (!$uninstall) { throw 'Uninstaller not found' }
          $result = Start-Process -FilePath $uninstall.FullName -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0 -or !(Test-Path -LiteralPath $marker)) { throw 'Uninstall retention check failed' }
      - name: Publish verified Windows prerelease from main
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./desktop/package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+-preview\.\d+$') {
            Write-Host "Stable version $version is published by its release workflow."
            exit 0
          }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }
          $asset = "OMP-Live-Map-$version-Windows-x64-Setup.exe"
          Copy-Item -LiteralPath 'desktop/dist/OMP-Live-Map-V3-Setup.exe' -Destination $asset
          $checksum = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath SHA256SUMS.txt -Value "$checksum  $asset" -Encoding ascii
          gh release create $tag $asset SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "OMP Live Map $tag" --notes-file "docs/release-$tag.md" --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
