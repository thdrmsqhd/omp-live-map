name: Windows verification isolation

on:
  push:
    branches: ['v2/phase-1-3']
    paths:
      - '.github/workflows/v2-windows-isolation.yml'
      - 'desktop/windows/**'
      - 'server/engineering/windows-checks.js'
      - 'tests/verification/windows-checks.cjs'

permissions:
  contents: read

jobs:
  isolation:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Windows isolated verification command
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools are unavailable' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $exe = Join-Path $env:RUNNER_TEMP 'omp-isolate.exe'
          $obj = Join-Path $env:RUNNER_TEMP 'omp-isolate.obj'
          $compile = 'call "' + $vcvars + '" && cl /nologo /W4 /EHsc /std:c++17 /MT /Fo:"' + $obj + '" /Fe:"' + $exe + '" desktop/windows/isolate.cpp /link userenv.lib advapi32.lib ole32.lib'
          cmd.exe /d /c $compile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/verification/windows-checks.cjs $exe
