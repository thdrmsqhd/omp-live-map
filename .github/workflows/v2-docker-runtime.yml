name: V2 real CLI isolated runtime
on:
  push:
    branches: ['v2/phase-1-3', 'v3/phase-4-6']
    paths:
      - '.github/workflows/v2-docker-runtime.yml'
      - 'server/engineering/**'
      - 'tests/verification/docker-runtime.cjs'

permissions:
  contents: read

jobs:
  real-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node --test
      - name: Build real OMP and Claude CLI runtime
        run: docker build --tag omp-live-map-runtime:v2.2 server/engineering/docker
      - name: Verify real CLIs against metered fixture provider
        run: |
          set -euo pipefail
          export OMP_RUNTIME_TEST_IMAGE="$(docker image inspect --format '{{.Id}}' omp-live-map-runtime:v2.2)"
          node tests/verification/docker-runtime.cjs
      - name: Report residual containers
        if: always()
        run: docker ps -a --filter name=omp-loop-
