name: Publish V4 README screenshots

on:
  push:
    branches: ['v4/ui-ux-improvements']
    paths: ['.github/workflows/v4-readme-screenshots.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v4/ui-ux-improvements
      - uses: actions/download-artifact@v4
        with:
          name: V4-UX-screenshots
          run-id: 45509666670
          github-token: ${{ github.token }}
          path: docs/media/v4
      - name: Store original CI screenshots
        run: |
          set -eu
          for f in 01-overview.png 02-workspace.png 03-live-map.png; do
            test -s "docs/media/v4/$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/v4/01-overview.png docs/media/v4/02-workspace.png docs/media/v4/03-live-map.png
          if ! git diff --cached --quiet; then
            git commit -m "docs(v4): store original CI UX screenshots [skip ci]"
            git push origin HEAD:refs/heads/v4/ui-ux-improvements
          fi
