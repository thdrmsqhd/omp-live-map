    <section id="overview" hidden aria-label="프로젝트 관제">
      <div class="overview-toolbar">
        <h1>프로젝트 관제 <small id="mon-total"></small></h1><button id="mon-sidebar" aria-pressed="false">세션 목록</button><label class="mon-search"><input id="mon-search" type="search" placeholder="세션·프로젝트 검색" aria-label="관제 검색"></label><button id="mon-settings" aria-expanded="false">설정</button>
        <label>표시 밀도 <select id="overview-density"><option value="compact">간결</option><option value="standard">기본</option><option value="detailed">상세</option></select></label>
        <label>정렬 <select id="overview-sort"><option value="stable">고정 순서</option><option value="attention">주의 우선</option><option value="memory">메모리</option><option value="recent">최근 활동</option><option value="name">이름</option></select></label>
        <div id="mon-settings-panel" hidden><label title="세션에 귀속된 프로세스의 메모리 경고 기준">RAM 경고(MB) <input id="overview-memory" type="number" min="128" max="1048576" step="128"></label>
        <label title="해제된 브라우저 블록은 다시 열 때 페이지를 재로드합니다"><input id="suspend-frames" type="checkbox">비활성 브라우저 해제</label>
        </div>
      </div>
      <div id="mon-summary" aria-label="관제 상태 필터"></div>
      <div id="mon-batch"><button id="overview-select-all">표시 항목 선택</button><span id="mon-selected"></span><button id="overview-close-selected">카드 닫기</button><button id="overview-pin-selected">세션 고정</button><button id="mon-clear">선택 해제</button>
      </div>
      <div id="overview-attention" aria-label="주의 필요"></div>
      <div id="overview-projects"></div>
      <p id="overview-source" role="status"></p>
    </section>
