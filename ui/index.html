<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMP live map</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/blocks.css">
  <link rel="stylesheet" href="css/jobs.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="brand"><b>omp</b> / live map</span>
    <div class="filters" id="filters">
      <button data-f="live" class="on" title="실행 중이거나 30분 안에 활동한 세션">활성</button>
      <button data-f="2h">2시간</button>
      <button data-f="24h">24시간</button>
      <button data-f="all">전체</button>
    </div>
    <div class="searchwrap">
      <input id="search" placeholder="비활성 세션 검색…" autocomplete="off">
      <div id="searchResults"></div>
    </div>
    <button id="unhide" title="숨긴 세션 복원" hidden></button>
    <button id="doneSubs" title="완료된 서브에이전트를 맵과 카드 목록에서 숨김"></button>
    <span id="conn" hidden title="서버와의 실시간 연결이 끊겼습니다. 화면 값은 마지막으로 받은 상태입니다.">연결 끊김 · 다시 연결 중…</span>
    <span id="spath"></span>
    <div class="zoom">
      <button id="zout" title="축소 (-)">−</button><button id="zk" title="현재 배율 · 클릭: 100% (1)">100%</button><button id="zin" title="확대 (+)">+</button>
      <button id="zfit" title="전체 보기 (0)">fit</button>
    </div>
  </div>
  <div id="ctxmenu"></div>
  <div id="minimap"><svg id="mmsvg" width="204" height="142"></svg></div>
  <div id="stage">
    <div id="wrapper">
      <svg id="edges"></svg>
      <svg id="guides"></svg>
      <div id="nodes"></div>
    </div>
  </div>
</div>

<!-- MVVM: core(상태·유틸) → model(계산) → viewmodel(전이·명령) → view(DOM) → app(조립) -->
  <script src="js/core/format.js"></script>
  <script src="js/core/dom.js"></script>
  <script src="js/core/markdown.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/persist.js"></script>
  <script src="js/model/layout.js"></script>
  <script src="js/model/layout-place.js"></script>
  <script src="js/model/route.js"></script>
  <script src="js/viewmodel/map.js"></script>
  <script src="js/viewmodel/session-block.js"></script>
  <script src="js/viewmodel/store.js"></script>
  <script src="js/viewmodel/term.js"></script>
  <script src="js/viewmodel/files.js"></script>
  <script src="js/viewmodel/dbui.js"></script>
  <script src="js/viewmodel/chat.js"></script>
  <script src="js/viewmodel/context.js"></script>
  <script src="js/viewmodel/chat-model.js"></script>
  <script src="js/viewmodel/live.js"></script>
  <script src="js/view/charts.js"></script>
  <script src="js/view/card-metrics.js"></script>
  <script src="js/view/card-session.js"></script>
  <script src="js/view/job-card.js"></script>
  <script src="js/view/card-compact.js"></script>
  <script src="js/view/spark-hover.js"></script>
  <script src="js/view/panel.js"></script>
  <script src="js/view/blocks.js"></script>
  <script src="js/view/block-controls.js"></script>
  <script src="js/view/chat-activity.js"></script>
  <script src="js/view/chat-model.js"></script>
  <script src="js/view/block-chat.js"></script>
  <script src="js/view/block-term.js"></script>
  <script src="js/view/block-bg.js"></script>
  <script src="js/view/block-files.js"></script>
  <script src="js/view/block-context.js"></script>
  <script src="js/view/block-browser.js"></script>
  <script src="js/view/block-db.js"></script>
  <script src="js/view/edges.js"></script>
  <script src="js/view/stage.js"></script>
  <script src="js/view/stage-input.js"></script>
  <script src="js/view/stage-layout-history.js"></script>
  <script src="js/view/stage-cluster-move.js"></script>
  <script src="js/view/stage-card-drag.js"></script>
  <script src="js/view/stage-card-resize.js"></script>
  <script src="js/view/minimap.js"></script>
  <script src="js/view/session-new.js"></script>
  <script src="js/view/menu.js"></script>
  <script src="js/view/search.js"></script>
  <script src="js/view/topbar.js"></script>

  <script src="js/app.js"></script>
</body>
</html>
